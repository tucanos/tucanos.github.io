name: Test mdBook Rust snippets

on:
  pull_request:
  workflow_dispatch:

env:
  # Rust snippets in this book document this tucanos revision.
  TUCANOS_REF: 57208b2dc3c9943f8e2634d7613546c59484b592

jobs:
  mdbook-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Install mdBook and mdbook-katex
        run: |
          cargo install --locked mdbook
          cargo install --locked mdbook-katex

      - name: Clone and build remote tucanos crates
        run: |
          git clone https://github.com/tucanos/tucanos /tmp/tucanos-remote
          cd /tmp/tucanos-remote
          git checkout --detach "$TUCANOS_REF"
          cargo build -p tmesh -p tucanos

      - name: Run mdbook test
        env:
          TMPDIR: ${{ github.workspace }}/.tmp-rustdoc
        run: |
          mkdir -p "$TMPDIR"
          mdbook test . \
            -L /tmp/tucanos-remote/target/debug/deps \
            -L /tmp/tucanos-remote/target/debug
