<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
  <defs>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .edge { stroke: #0f172a; stroke-width: 2.2; fill: none; }
      .shared { stroke: #dc2626; stroke-width: 7; stroke-linecap: round; }
      .surf { fill: #93c5fd; fill-opacity: 0.28; stroke: #1d4ed8; stroke-width: 1.5; }
      .surf2 { fill: #fca5a5; fill-opacity: 0.30; stroke: #b91c1c; stroke-width: 1.5; }
      .v { fill: #0f172a; }
      .hot { fill: #dc2626; }
      .title { font: 700 17px 'DejaVu Sans', sans-serif; fill: #0f172a; }
      .label { font: 500 13px 'DejaVu Sans', sans-serif; fill: #334155; }
      .small { font: 500 11px 'DejaVu Sans', sans-serif; fill: #475569; }
      .tag { font: 600 13px 'DejaVu Sans', sans-serif; fill: #0f172a; }
      .bad { font: 700 12px 'DejaVu Sans', sans-serif; fill: #b91c1c; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 7; }
      .arrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .missing { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 4; fill: none; marker-end: url(#r); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="530" height="410" rx="10" class="panel"/>
  <rect x="555" y="10" width="355" height="410" rx="10" class="panel"/>

  <text x="30" y="40" class="title">Geometry: three sheets share an edge</text>
  <text x="575" y="40" class="title">Invalid hierarchy fragment</text>

  <!-- Sheets around edge (0,1): schematic tetrahedral corners -->
  <polygon points="150,250 270,150 115,95" class="surf"/>
  <polygon points="150,250 270,150 285,300" class="surf"/>
  <polygon points="150,250 115,95 285,300" class="surf"/>
  <line x1="150" y1="250" x2="270" y2="150" class="edge"/>
  <line x1="270" y1="150" x2="115" y2="95" class="edge"/>
  <line x1="115" y1="95" x2="150" y2="250" class="edge"/>
  <line x1="150" y1="250" x2="285" y2="300" class="edge"/>
  <line x1="285" y1="300" x2="270" y2="150" class="edge"/>
  <line x1="115" y1="95" x2="285" y2="300" class="edge"/>

  <polygon points="150,250 380,110 300,70 420,190" class="surf"/>
  <polygon points="150,250 300,70 420,190" class="surf"/>
  <polygon points="150,250 380,110 420,190" class="surf"/>
  <line x1="150" y1="250" x2="380" y2="110" class="edge"/>
  <line x1="380" y1="110" x2="300" y2="70" class="edge"/>
  <line x1="300" y1="70" x2="150" y2="250" class="edge"/>
  <line x1="420" y1="190" x2="380" y2="110" class="edge"/>
  <line x1="420" y1="190" x2="300" y2="70" class="edge"/>

  <polygon points="150,250 285,360 395,330 320,215" class="surf"/>
  <polygon points="150,250 320,215 395,330" class="surf"/>
  <line x1="150" y1="250" x2="285" y2="360" class="edge"/>
  <line x1="285" y1="360" x2="395" y2="330" class="edge"/>
  <line x1="395" y1="330" x2="320" y2="215" class="edge"/>
  <line x1="320" y1="215" x2="150" y2="250" class="edge"/>

  <!-- Separate sheet touching only at vertex 0 -->
  <polygon points="150,250 455,300 500,240 470,365" class="surf2"/>
  <polygon points="150,250 500,240 470,365" class="surf2"/>
  <line x1="150" y1="250" x2="455" y2="300" class="edge"/>
  <line x1="455" y1="300" x2="500" y2="240" class="edge"/>
  <line x1="500" y1="240" x2="470" y2="365" class="edge"/>
  <line x1="470" y1="365" x2="150" y2="250" class="edge"/>

  <!-- Shared edge and contact vertex -->
  <line x1="150" y1="250" x2="270" y2="150" class="shared"/>
  <circle cx="150" cy="250" r="8" class="hot"/>
  <circle cx="270" cy="150" r="5" class="v"/>
  <circle cx="115" cy="95" r="4" class="v"/>
  <circle cx="285" cy="300" r="4" class="v"/>
  <circle cx="380" cy="110" r="4" class="v"/>
  <circle cx="300" cy="70" r="4" class="v"/>
  <circle cx="420" cy="190" r="4" class="v"/>
  <circle cx="285" cy="360" r="4" class="v"/>
  <circle cx="395" cy="330" r="4" class="v"/>
  <circle cx="320" cy="215" r="4" class="v"/>
  <circle cx="455" cy="300" r="4" class="v"/>
  <circle cx="500" cy="240" r="4" class="v"/>
  <circle cx="470" cy="365" r="4" class="v"/>

  <text x="160" y="238" class="label">vertex 0: single-vertex contact</text>
  <text x="285" y="132" class="label">shared edge (0, 1)</text>
  <text x="330" y="390" class="small">another patch touches only vertex 0</text>

  <!-- Hierarchy layers -->
  <text x="575" y="82" class="small">face tags, dim 2</text>
  <text x="575" y="192" class="small">edge tags, dim 1</text>
  <text x="575" y="302" class="small">node tags, dim 0</text>
  <line x1="570" y1="100" x2="890" y2="100" stroke="#e2e8f0"/>
  <line x1="570" y1="210" x2="890" y2="210" stroke="#e2e8f0"/>
  <line x1="570" y1="320" x2="890" y2="320" stroke="#e2e8f0"/>

  <rect x="635" y="108" width="210" height="42" rx="7" class="box"/>
  <text x="740" y="134" class="tag" text-anchor="middle">face tag (2, 1)</text>

  <rect x="635" y="218" width="210" height="42" rx="7" class="box" style="stroke:#dc2626"/>
  <text x="740" y="238" class="tag" text-anchor="middle">ghost edge tag (1, g)</text>
  <text x="740" y="253" class="bad" text-anchor="middle">parents = ∅</text>

  <rect x="635" y="328" width="210" height="42" rx="7" class="box"/>
  <text x="740" y="354" class="tag" text-anchor="middle">node tag (0, n)</text>

  <path d="M740 150 L740 210" class="missing"/>
  <text x="755" y="184" class="bad">no parent link</text>
  <path d="M740 260 L740 320" class="arrow"/>
</svg>
