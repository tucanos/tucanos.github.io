<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <defs>
    <style>
      .title { font: 700 22px 'DejaVu Sans', sans-serif; fill: #1f2937; }
      .node { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .lbl { font: 600 14px 'DejaVu Sans', sans-serif; fill: #111827; }
      .small { font: 500 13px 'DejaVu Sans', sans-serif; fill: #374151; }
      .edge { stroke: #4b5563; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text x="24" y="36" class="title">Topology tree for the two-triangle square</text>

  <!-- dim 2 nodes -->
  <rect x="70" y="90" width="150" height="56" rx="10" class="node"/>
  <text x="86" y="114" class="lbl">(dim 2, tag 1)</text>
  <text x="86" y="133" class="small">triangle ABC</text>

  <rect x="340" y="90" width="150" height="56" rx="10" class="node"/>
  <text x="356" y="114" class="lbl">(dim 2, tag 2)</text>
  <text x="356" y="133" class="small">triangle ACD</text>

  <!-- dim 1 nodes -->
  <rect x="60" y="220" width="170" height="56" rx="10" class="node"/>
  <text x="76" y="244" class="lbl">(dim 1, tag 10)</text>
  <text x="76" y="263" class="small">parents: {1}</text>

  <rect x="196" y="300" width="170" height="56" rx="10" class="node"/>
  <text x="212" y="324" class="lbl">(dim 1, tag 30)</text>
  <text x="212" y="343" class="small">parents: {1,2}</text>

  <rect x="332" y="220" width="170" height="56" rx="10" class="node"/>
  <text x="348" y="244" class="lbl">(dim 1, tag 20)</text>
  <text x="348" y="263" class="small">parents: {2}</text>

  <!-- connections -->
  <path d="M145 146 L145 220" class="edge"/>
  <path d="M145 146 L280 300" class="edge"/>
  <path d="M415 146 L415 220" class="edge"/>
  <path d="M415 146 L280 300" class="edge"/>

  <!-- dim labels -->
  <text x="20" y="124" class="small">dim 2</text>
  <text x="20" y="252" class="small">dim 1</text>

  <!-- footnote -->
  <text x="24" y="388" class="small">In implementation terms, each node stores children and parents.</text>
  <text x="24" y="406" class="small">Children are one dimension lower; parent sets must be unique per tag.</text>
</svg>
