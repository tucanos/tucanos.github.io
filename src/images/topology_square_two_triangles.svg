<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <defs>
    <style>
      .title { font: 700 22px 'DejaVu Sans', sans-serif; fill: #1f2937; }
      .lbl { font: 600 16px 'DejaVu Sans', sans-serif; fill: #111827; }
      .small { font: 500 14px 'DejaVu Sans', sans-serif; fill: #374151; }
      .edge { stroke: #111827; stroke-width: 3; fill: none; }
      .diag { stroke: #b91c1c; stroke-width: 3; fill: none; }
      .vtx { fill: #111827; }
    </style>
  </defs>

  <text x="24" y="36" class="title">Square split into two triangles (proper face tags)</text>

  <!-- triangles -->
  <polygon points="110,320 270,320 270,160" fill="#bfdbfe" opacity="0.9"/>
  <polygon points="110,320 270,160 110,160" fill="#fde68a" opacity="0.9"/>

  <!-- boundary edges -->
  <line x1="110" y1="320" x2="270" y2="320" class="edge"/>
  <line x1="270" y1="320" x2="270" y2="160" class="edge"/>
  <line x1="270" y1="160" x2="110" y2="160" class="edge"/>
  <line x1="110" y1="160" x2="110" y2="320" class="edge"/>

  <!-- interface edge -->
  <line x1="110" y1="320" x2="270" y2="160" class="diag"/>

  <!-- vertices -->
  <circle cx="110" cy="320" r="5" class="vtx"/>
  <circle cx="270" cy="320" r="5" class="vtx"/>
  <circle cx="270" cy="160" r="5" class="vtx"/>
  <circle cx="110" cy="160" r="5" class="vtx"/>

  <!-- vertex labels -->
  <text x="92" y="342" class="small">A</text>
  <text x="276" y="342" class="small">B</text>
  <text x="276" y="154" class="small">C</text>
  <text x="92" y="154" class="small">D</text>

  <!-- element tags -->
  <text x="222" y="256" class="lbl">elem tag 1</text>
  <text x="136" y="236" class="lbl">elem tag 2</text>

  <!-- face tag labels -->
  <text x="165" y="344" class="small">edge tag 10 (parent {1})</text>
  <text x="286" y="246" class="small">edge tag 10 (parent {1})</text>
  <text x="136" y="146" class="small">edge tag 20 (parent {2})</text>
  <text x="8" y="246" class="small">edge tag 20 (parent {2})</text>
  <text x="151" y="235" class="small" fill="#991b1b">edge tag 30 (parents {1,2})</text>

  <!-- legend -->
  <rect x="336" y="110" width="200" height="180" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="352" y="138" class="lbl">Tagging rule shown</text>
  <text x="352" y="165" class="small">- boundary edges on tag 1 side:</text>
  <text x="352" y="183" class="small">  use tag 10</text>
  <text x="352" y="207" class="small">- boundary edges on tag 2 side:</text>
  <text x="352" y="225" class="small">  use tag 20</text>
  <text x="352" y="249" class="small">- interface edge:</text>
  <text x="352" y="267" class="small">  use tag 30</text>
</svg>
